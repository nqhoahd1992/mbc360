name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f apps/api/Dockerfile --target runtime -t mbc360-api:${{ github.sha }} .
      # The migrate target is what applies schema changes on deploy; if it stops
      # building, the api can no longer start at all (it depends_on migrate
      # completing successfully). Catch that here, not on the production server.
      - name: Build migrate image
        run: docker build -f apps/api/Dockerfile --target migrate -t mbc360-migrate:${{ github.sha }} .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t mbc360-web:${{ github.sha }} .
      # Pushing to a registry (GHCR or internal) is wired up at deploy time —
      # add a login + push step here once the target registry is decided.
