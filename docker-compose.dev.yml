# Dev infrastructure ONLY — the apps are NOT containerized in dev.
# Run `docker compose -f docker-compose.dev.yml up -d` for Postgres,
# then `npm run dev` at the repo root to start shared (tsc watch),
# api (nest watch) and web (vite HMR) natively.
services:
  postgres:
    image: postgres:17-alpine
    container_name: mbc360-postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: mbc360
      POSTGRES_PASSWORD: mbc360
      POSTGRES_DB: mbc360
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mbc360 -d mbc360']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
