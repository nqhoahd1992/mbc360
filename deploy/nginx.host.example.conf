# Example HOST nginx server block for the self-hosted MBc360 stack — generic,
# assumes docker-compose.prod.yml's default ports (8080 web / 3000 api) and a
# single-tenant server. If deploying onto a shared VPS where those ports are
# already taken by another project (as with the mbcstaging.com fleet), see
# nginx.mbcstaging.conf instead for the real, ported-and-adjusted version.
# TLS certificates: use your existing setup (e.g. certbot).
# The containers bind to 127.0.0.1 only (see docker-compose.prod.yml).
server {
  listen 443 ssl;
  http2 on;
  server_name mbc360.example.internal;

  # ssl_certificate     /etc/letsencrypt/live/mbc360.example.internal/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/mbc360.example.internal/privkey.pem;

  location /api {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
  }
}

server {
  listen 80;
  server_name mbc360.example.internal;
  return 301 https://$host$request_uri;
}
