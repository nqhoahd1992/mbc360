# -------------------------------------------------------
# mbc360.mbcstaging.com → mbc360-app (web + api, one domain)
#   web (frontend, nginx-in-container): port 8086
#   api (NestJS, everything under /api/*): port 3001
#
# NOTE on ports: this repo's docker-compose.prod.yml defaults to 8080/3000,
# but 8080 is already used by products.mbcstaging.com (master_product) on
# this VPS, so this deployment overrides them via WEB_HOST_PORT=8086 and
# API_HOST_PORT=3001 in the untracked .env next to docker-compose.prod.yml.
# Before first start, confirm both are actually free:
#   ss -tlnp | grep -E ':(8086|3001)\b'
# (nothing already occupying them, e.g. from powerappsku/ads or any other
# project's stack) — pick different numbers here AND in that .env if not.
#
# server_name below is a placeholder guess (mbc360.mbcstaging.com, matching
# this VPS's <project>.mbcstaging.com convention) — change it everywhere in
# this file if the actual subdomain differs.
#
# FIRST-TIME SETUP ORDER (same as every other block in this file):
#   1. docker compose -f docker-compose.prod.yml up -d   (containers answer
#      on 127.0.0.1:8086 / 127.0.0.1:3001 before nginx can proxy to them)
#   2. Add ONLY the "listen 80" server block below (drop the "listen 443"
#      block and its ssl_certificate lines — they don't exist yet), reload:
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d mbc360.mbcstaging.com
#      This obtains the certificate and rewrites this file into the full
#      "managed by Certbot" form shown below automatically, same as
#      products/timesheet/marketplace/ads/etc. already are in this file.
# -------------------------------------------------------
server {
    server_name mbc360.mbcstaging.com;

    access_log /var/log/nginx/mbc360_access.log;
    error_log  /var/log/nginx/mbc360_error.log;

    client_max_body_size 50M;

    # NestJS API — app.setGlobalPrefix('api'), so the full /api/* path must
    # reach the container unchanged (proxy_pass with no path after the port
    # does exactly that; do not add a trailing path here).
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Frontend — built SPA served by the web container's own nginx.
    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mbc360.mbcstaging.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mbc360.mbcstaging.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = mbc360.mbcstaging.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name mbc360.mbcstaging.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
