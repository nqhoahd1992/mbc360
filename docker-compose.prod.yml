# Production stack, fronted by the HOST nginx (TLS termination + routing):
#   /     -> 127.0.0.1:${WEB_HOST_PORT:-8080}  (web container)
#   /api  -> 127.0.0.1:${API_HOST_PORT:-3000}  (api container)
# See deploy/nginx.host.example.conf for the host server block (generic,
# assumes the default ports below) — deploy/nginx.mbcstaging.conf is the
# actual config for the shared mbcstaging.com VPS, which uses different
# ports because 8080/3000 already collide with other projects there.
#
# Secrets/overrides live in an untracked .env file next to this compose file
# (NOT apps/api/.env, which only local `npm run dev` reads — the container
# only gets what's listed in the `environment:` block below):
#   POSTGRES_PASSWORD=...     (required)
#   WEB_HOST_PORT / API_HOST_PORT (optional, default 8080 / 3000 — change
#                              only if those ports are already taken on the
#                              host, e.g. by another project's stack; must
#                              match whatever the host nginx proxies to)
#   SESSION_SECRET=...        (required — signs session cookies; api refuses
#                              to start in production without it)
#   AUTH_TENANT_ID=...        (required for real Entra sign-in)
#   AUTH_CLIENT_ID=...        (required for real Entra sign-in)
#   AUTH_CLIENT_SECRET=...    (required for real Entra sign-in)
#   APP_BASE_URL=...          (e.g. https://mbc360.example.com — where the
#                              browser lands after sign-in/sign-out)
#   AUTH_REDIRECT_URI=...     (must exactly match the Entra app registration's
#                              redirect URI; defaults to
#                              ${APP_BASE_URL}/api/auth/callback if unset)
#   AUTH_AUTO_ADMIN_ROLE=...  (optional, default off — TEMPORARY dev-phase
#                              flag; "true" auto-grants admin to every
#                              zero-role Microsoft 365 sign-in, with NO
#                              production lockout. Leave unset/false once
#                              real users are on this deployment.)
#   WEB_IMAGE / API_IMAGE     (optional registry image refs; defaults build locally)
services:
  web:
    image: ${WEB_IMAGE:-mbc360-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-8080}:80'
    depends_on:
      - api

  api:
    image: ${API_IMAGE:-mbc360-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://mbc360:${POSTGRES_PASSWORD}@postgres:5432/mbc360
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_TENANT_ID: ${AUTH_TENANT_ID}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI}
      AUTH_AUTO_ADMIN_ROLE: ${AUTH_AUTO_ADMIN_ROLE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbc360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mbc360
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mbc360 -d mbc360']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
